{% extends "base.html" %}
{% block content %}

<h2>Submit a Review (Admin Only)</h2>

<form method="POST">
    <label for="BookID">Choose a book:</label><br>
    <select name="BookID">
        {% for book in books %}
        <option value="{{ book.BookID }}">{{ book.Title }} by {{ book.Author }}</option>
        {% endfor %}
    </select><br><br>

    <label for="Content">Comment:</label><br>
    <textarea name="Content" rows="4" cols="40"></textarea><br><br>

    <label for="Rating">Rating (1–5, optional):</label><br>
    <input type="number" name="Rating" min="1" max="5"><br><br>

    <input type="submit" value="Submit Review">
</form>

{% endblock %}
